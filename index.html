<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Aire d'un rectangle</title>
  <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a5f);
  }

  .carte {
    width: min(420px, 90%);
    padding: 32px;
    border-radius: 20px;
    background-color: white;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
  }

  h1 {
    margin-top: 0;
    color: #163c66;
    text-align: center;
  }

  .intro {
    color: #475569;
    text-align: center;
    line-height: 1.5;
  }

  label {
    display: block;
    margin-top: 18px;
    margin-bottom: 6px;
    font-weight: bold;
    color: #1e293b;
  }

  input {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 16px;
  }

  button {
    width: 100%;
    margin-top: 24px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background-color: #f59e0b;
    color: #1f2937;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background-color: #fbbf24;
  }

  .resultat {
    min-height: 54px;
    margin-top: 22px;
    padding: 14px;
    border-radius: 10px;
    background-color: #eff6ff;
    color: #163c66;
    font-weight: bold;
    text-align: center;
  }
</style>
</head>

<body>
  <main class="carte">
    <h1>Calculateur d'aire</h1>

    <p class="intro">
      Saisis les dimensions du rectangle en centimètres.
    </p>

    <label for="longueur">Longueur (cm)</label>
    <input type="number" id="longueur" min="0" step="0.1" placeholder="Ex. : 12,5">

    <label for="largeur">Largeur (cm)</label>
    <input type="number" id="largeur" min="0" step="0.1" placeholder="Ex. : 8">

    <button onclick="calculerAire()">Calculer l'aire</button>

    <p id="resultat" class="resultat">
      Le résultat apparaîtra ici.
    </p>
  </main>

  <script>
    function calculerAire() {
      const longueur = Number(document.getElementById("longueur").value);
      const largeur = Number(document.getElementById("largeur").value);
      const resultat = document.getElementById("resultat");

      if (longueur > 0 && largeur > 0) {
        const aire = longueur * largeur;

        resultat.textContent =
          "Aire du rectangle : " + aire + " cm²";
      } else {
        resultat.textContent =
          "Saisis deux dimensions strictement positives.";
      }
    }
  </script>
</body>
</html>
